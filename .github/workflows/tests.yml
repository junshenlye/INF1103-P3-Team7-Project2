name: Stackplan verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m compileall -q src tests
      - run: python -m pytest -q
      - run: npm run check --prefix frontend
      - run: npm run test:loading --prefix frontend
      - run: npm run test:calendar --prefix frontend
      - run: npm run test:intake --prefix frontend
      - run: npm run test:recovery --prefix frontend
