name: Python verification

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Lint with Ruff
        run: |
          python -m pip install ruff==0.8.6
          ruff check --output-format=github src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
