name: Stackplan verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m compileall -q src tests
      - run: python scripts/check_uml.py
      - run: python scripts/test.py
      - run: npm run test:loading --prefix frontend
      - run: npm run test:calendar --prefix frontend
      - run: npm run test:intake --prefix frontend
      - run: npm run test:recovery --prefix frontend
  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile notification integrations
        run: python -m compileall -q integrations/github_actions_notifier integrations/telegram_bot
      - name: Test GitHub Actions notifier
        run: python -m unittest discover -s integrations/github_actions_notifier -v
      - name: Test Telegram bot and installer
        run: python -m unittest discover -s integrations/telegram_bot -v
