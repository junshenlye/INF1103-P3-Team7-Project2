name: Python and frontend verification

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Lint with Ruff
        run: |
          python -m pip install ruff==0.8.6
          ruff check --output-format=github src tests

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Run frontend checks
        run: npm run check --prefix frontend

      - name: Run loading browser regression
        run: npm run test:loading --prefix frontend

      - name: Run calendar browser regression
        run: npm run test:calendar --prefix frontend
