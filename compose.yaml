x-backend: &backend
  image: stackplan-project2
  build: {context: ., target: runtime}
  environment: &environment
    DATABASE_URL: postgresql://stackplan:${POSTGRES_PASSWORD:-stackplan-local}@database:5432/stackplan
    DOCUMENT_DIRECTORY: /data/documents
    DATABASE_POOL_SIZE: 4
  volumes:
    - documents-v2:/data/documents
  init: true
  read_only: true
  tmpfs: [/tmp]

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stackplan
      POSTGRES_USER: stackplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackplan-local}
    volumes:
      - postgres-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackplan -d stackplan"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 2s
  migrate:
    <<: *backend
    command: ["python", "-m", "src.migrate"]
    depends_on:
      database: {condition: service_healthy}
  app:
    <<: *backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3)"]
      interval: 60s
      timeout: 4s
      retries: 3
      start_period: 20s
      start_interval: 2s
  worker:
    <<: *backend
    command: ["python", "-m", "src.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *environment
      DOCLING_URL: ${DOCLING_URL:-http://docling:5001}
    depends_on:
      migrate: {condition: service_completed_successfully}
  docling:
    image: ${DOCLING_IMAGE:-quay.io/docling-project/docling-serve-cpu:v1.21.0}
    cpus: 2
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 5s
  test-database:
    profiles: [test]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stackplan_rebuild_test
      POSTGRES_USER: stackplan_test
      POSTGRES_PASSWORD: stackplan_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackplan_test -d stackplan_rebuild_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    profiles: [test]
    build: {context: ., target: test}
    environment:
      STACKPLAN_TEST_DATABASE_URL: postgresql://stackplan_test:stackplan_test@test-database:5432/stackplan_rebuild_test
    depends_on:
      test-database: {condition: service_healthy}
    command: ["-q"]
volumes:
  postgres-v2:
  documents-v2:
